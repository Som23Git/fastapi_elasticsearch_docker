version: '3.8'

services:

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.0
    container_name: elasticsearch-fastapi
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - appnet

  kibana:
    image: docker.elastic.co/kibana/kibana:8.18.0
    container_name: kibana-fastapi
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - appnet

  fastapi:
    build:
      context: ./fastapi_app
    container_name: fastapi-container
    ports:
      - "8000:8000"
    depends_on:
      - elasticsearch
    networks:
      - appnet
    volumes:
      - ./logs:/app/logs
    environment:
      - LOG_LEVEL=INFO  # ✅ Optional: can add to control logging level easily
      - ELASTICSEARCH_URL=http://elasticsearch:9200  # ✅ Good practice to pass Elasticsearch URL via env

networks:
  appnet:
    driver: bridge